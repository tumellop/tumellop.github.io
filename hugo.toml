baseURL = "https://tumellop.github.io/"  # Your website URL
languageCode = "en"
title = "Tumello Phage"       # The title in the browser tab
theme = "LoveIt"            # The theme name (must match your folder name in 'themes')

[params]
  # default theme mode ("light", "dark", "auto")
  defaultTheme = "dark"

  # Website Header Config
  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    [params.header.title]
      name = "prxncessZA"   # <--- CHANGED TO YOUR NAME
      pre = ""              # You can add an icon code here if you want
      typeit = true         # <--- KEEPS THE TYPING ANIMATION ON

  # Home Page Config (The big profile section)
  [params.home]
    rss = 10
    [params.home.profile]
      enable = true
      gravatarEmail = ""
      avatarURL = "/images/avatar.jpeg"  # Matches the file you put in static/images/
      title = "Tumello Phage"                        # Optional big title under image
      subtitle = "I am a blogger | coder | tech enthusiast" # The typing text under your picture
      typeit = true                     # Turns on the typing effect
      social = true                     # Turns on social icons (configured below)

  # Social Media Links (Remove the ones you don't want)
  [params.social]
    GitHub = "tumellop"      # Your GitHub username
    Twitter = "yourhandle"   # Your Twitter handle
    Instagram = "yourhandle"
    Email = "tumellop@gmail.com"

[menu]
  [[menu.main]]
    identifier = "posts"
    pre = ""
    post = ""
    name = "Posts"
    url = "/posts/"
    title = ""
    weight = 1

  [[menu.main]]
    identifier = "tags"
    pre = ""
    post = ""
    name = "Tags"
    url = "/tags/"
    title = ""
    weight = 2

  [[menu.main]]
